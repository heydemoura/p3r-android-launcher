name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Sign and verify APK
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="Reload-Home-${RELEASE_TAG}.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:APK_STORE_PASSWORD \
            --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -p 4 "$apk"
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "Reload-Home-${RELEASE_TAG}.apk" --clobber --repo "$GITHUB_REPOSITORY"
